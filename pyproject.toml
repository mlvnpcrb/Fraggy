[project]
name = "fraggyapi"
version = "0.1.0"
description = "Perfume catalog API with resumable Fragrantica synchronization"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy", "httpx", "beautifulsoup4", "psycopg[binary]"]
[project.optional-dependencies]
dev = ["pytest"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
