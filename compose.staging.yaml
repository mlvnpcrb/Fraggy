# API only. There is deliberately no worker or scheduled service here.
services:
  api:
    image: fraggyapi:staging
    ports:
      - "127.0.0.1:${FRAGGY_PORT:-8000}:8000"
    env_file:
      - .env.staging
    volumes:
      - catalog:/app/var
      - ./inputs:/app/inputs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped
volumes:
  catalog:
