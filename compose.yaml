services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/var/fraggy.db
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-120}
      API_CACHE_TTL_SECONDS: ${API_CACHE_TTL_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    volumes:
      - catalog:/app/var
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
    restart: unless-stopped
  sync:
    profiles: ["scraping"]
    build: .
    command: ["python", "-m", "fraggy.sync", "--daily"]
    environment:
      DATABASE_URL: sqlite:////app/var/fraggy.db
      SCRAPING_APPROVED_SOURCES: ${SCRAPING_APPROVED_SOURCES:-}
      LIVE_VALIDATED_SOURCES: ${LIVE_VALIDATED_SOURCES:-}
      SYNC_SOURCES: ${SYNC_SOURCES:-all}
      SCRAPE_DELAY_SECONDS: ${SCRAPE_DELAY_SECONDS:-20}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-FraggyAPI/0.1}
    volumes:
      - catalog:/app/var
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  catalog:
