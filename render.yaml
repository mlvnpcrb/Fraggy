services:
  - type: web
    name: fraggy-cutouts-beta
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: FRAGGY_GATEWAY_URL
        value: https://flczhwwlvfnkqmtxpkmq.supabase.co/functions/v1/beta-gateway
      - key: FRAGGY_WORKER_TOKEN
        sync: false
