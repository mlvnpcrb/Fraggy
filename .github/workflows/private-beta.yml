name: Private beta checks
on:
  pull_request:
  push:
    branches: [feat/private-beta]
permissions:
  contents: read
jobs:
  app-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fraggy_beta_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      FRAGGY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/fraggy_beta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test && npm run test:db
      - run: npx expo export --platform all --output-dir /tmp/fraggy-beta-export
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile -t fraggy-worker-beta .
      - run: bash scripts/test-worker-memory.sh
