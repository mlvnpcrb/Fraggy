name: Scaffold checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: SDK dependency compatibility
        run: npx expo install --check
        env:
          EXPO_OFFLINE: "1"
      - name: Static web production build
        run: npm run build:web -- --max-workers 2
      - name: Android and iOS JavaScript bundles
        run: npx expo export --platform android --platform ios --output-dir dist-native --max-workers 2
      - uses: actions/upload-artifact@v4
        with:
          name: fraggy-web-preview
          path: dist/
          if-no-files-found: error
